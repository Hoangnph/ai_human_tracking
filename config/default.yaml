# Default configuration file for Retail Monitor

# Application settings
app_name: "Retail Monitor"

# YOLO Configuration
yolo_model: "yolov8n.pt"  # Mô hình nhỏ nhất, phù hợp cho MVP
yolo_confidence: 0.5      # Ngưỡng tin cậy cho phát hiện người

# Face Recognition Configuration
face_recognition_tolerance: 0.6  # Ngưỡng tolerance cho nhận diện khuôn mặt

# MediaPipe Configuration
mediapipe_confidence: 0.5  # Ngưỡng tin cậy cho MediaPipe pose detection

# Video settings
frame_width: 640
frame_height: 480
fps: 30
default_camera_id: 0  # Camera mặc định (0 là webcam đầu tiên)

# Database settings
database_url: "sqlite:///./data/app.db"  # SQLite cho MVP

# Logging
log_level: "INFO" 